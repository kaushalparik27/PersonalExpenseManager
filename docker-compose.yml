services:
  postgres:
    image: postgres:16-alpine
    container_name: pem-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-personal_expense_manager}
      POSTGRES_USER: ${POSTGRES_USER:-pem_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pem_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pem-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pem_user} -d ${POSTGRES_DB:-personal_expense_manager}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pem-postgres-data:
